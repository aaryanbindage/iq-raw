<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IQ Raw</title>
<script src="/theme.js"></script>
<script src="/preferences.js"></script>
<link rel="stylesheet" href="/base.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header>
  <div class="appbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">IQ</span><div><h1>IQ Raw</h1><p>Your robot. Your code.</p></div></div>
    <div class="view-actions" aria-label="Editor views">
      <button id="controlsToggle" type="button" aria-controls="programConfig" aria-expanded="true">Program controls</button>
      <button id="codeToggle" type="button" aria-controls="sourcePanel" aria-pressed="true">Code</button>
      <button id="consoleToggle" type="button" aria-controls="consolePanel" aria-pressed="true">Console</button>
      <button id="fullscreenToggle" type="button" aria-pressed="false">Fullscreen</button>
    </div>
    <a id="settingsLink" class="button-link" href="/settings.html">Settings</a>
  </div>
  <div class="toolbar" aria-label="Program controls">
    <div class="control-group" id="programConfig">
      <label>Language <select id="lang"><option value="python">Python</option><option value="cpp">C++</option></select></label>
      <label>Slot <select id="slot"></select></label>
      <label>Name <input type="text" id="name" maxlength="32" value="iq-raw"></label>
    </div>
    <div class="control-group">
      <button id="send" class="primary" title="Send the code to the slot and run it">Download and run</button>
      <button id="sendOnly" title="Send the code without starting it">Download</button>
      <button id="run" title="Run the program already in this slot">Run slot</button>
      <button id="stop">Stop</button>
      <button id="build" title="Compile without sending to the brain" hidden>Build only</button>
    </div>
    <div class="control-group device-tools">
      <button id="vm" title="Install once per brain, and again after a VEXos update">Install Python VM</button>
    </div>
  </div>
</header>
<div class="connection"><span id="brain" role="status">Brain: checking...</span><button id="refresh">Check brain</button></div>
<main>
  <section id="blocks" class="editor-panel" aria-labelledby="blocksHeading">
    <div class="panel-heading"><h2 id="blocksHeading">Block workspace</h2><span>Build something that moves</span></div>
    <div id="blocklyDiv"></div>
    <div class="panel-foot">Drag blocks onto the canvas · Scroll to zoom · Escape exits fullscreen</div>
  </section>
  <aside id="codeSidebar" class="editor-panel" aria-label="Code and console panels">
    <section id="sourcePanel" aria-labelledby="codeHeading">
    <div class="panel-heading"><h2 id="codeHeading">Your code</h2><span id="codeMode">Synced with blocks</span></div>
    <div class="bar">
      <label><input type="checkbox" id="manual"> Edit code by hand</label>
      <span class="spacer"></span>
      <button id="open">Open .py</button>
      <button id="save">Save .py</button>
      <button id="programs">Programs on brain</button>
      <button id="probe" title="Run a test program to inspect the brain's Python API">Probe brain API</button>
      <input type="file" id="file" accept=".py,.cpp,text/x-python,text/plain" hidden>
    </div>
    <textarea id="code" aria-label="Program source code" spellcheck="false" readonly></textarea>
    </section>
    <section id="consolePanel" aria-labelledby="consoleHeading">
      <div class="panel-heading console-heading"><h2 id="consoleHeading">Console</h2><span id="consoleStatus">Tool output · brain disconnected</span><div class="console-actions"><button id="consoleConnect" type="button">Connect brain</button><button id="consoleClear" type="button">Clear</button><button id="consoleCopy" type="button">Copy</button></div></div>
      <section id="transferProgress" class="transfer-progress" aria-label="Build and download progress" hidden>
        <div class="transfer-heading"><span id="transferLabel" role="status">Preparing download…</span><span id="transferPercent"></span><button id="transferDismiss" type="button" aria-label="Dismiss transfer progress">×</button></div>
        <pre id="transferBar" role="progressbar" aria-label="Build and download progress" aria-valuemin="0" aria-valuemax="100"></pre>
      </section>
      <dl id="liveMonitors" aria-label="Live value monitors" hidden></dl>
      <pre id="log" aria-label="Console output" tabindex="0"></pre>
      <form id="consoleForm"><label class="sr-only" for="consoleInput">Send a line to the brain</label><input id="consoleInput" type="text" placeholder="Send a line to the brain…" autocomplete="off" disabled><button id="consoleSend" type="submit" disabled>Send</button></form>
    </section>
  </aside>
</main>
<script src="/vendor/blockly/blockly_compressed.js"></script>
<script src="/vendor/blockly/blocks_compressed.js"></script>
<script src="/vendor/blockly/python_compressed.js"></script>
<script src="/vendor/blockly/msg/en.js"></script>
<script src="/iq-blocks.js"></script>
<script src="/iq-cpp.js"></script>
<script src="/iq-catalog.js"></script>
<script src="/iq-math.js"></script>
<script src="/iq-vex.js"></script>
<script src="/editor-ui.js"></script>
<script src="/console-renderer.js"></script>
<script src="/transfer-ui.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem('iqraw.' + k); return v == null ? d : v; } catch { return d; } },
    set(k, v) { try { localStorage.setItem('iqraw.' + k, v); } catch { /* storage blocked */ } },
  };
  const STARTERS = {
    python: 'from vex import *\n\nbrain = Brain()\n\nbrain.screen.print("Hello IQ")\n',
    cpp: '#include "vex.h"\n\nusing namespace vex;\n\nvex::brain Brain;\n\nint main() {\n    Brain.Screen.print("Hello IQ");\n\n    while (true) {\n        this_thread::sleep_for(10);\n    }\n}\n',
  };
  let lang = store.get('lang', 'python') === 'cpp' ? 'cpp' : 'python';
  $('lang').value = lang;

  // ---- log ----
  const log = (text, cls) => { const s = document.createElement('span'); if (cls) s.className = cls; s.textContent = text + '\n'; $('log').append(s); $('log').scrollTop = 1e9; };
  const api = async (path, body) => {
    const r = await fetch('/api/' + path, body === undefined ? {} : { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.statusText);
    return j;
  };
  const busy = (on) => ['send','sendOnly','run','stop','build','vm','refresh'].forEach(id => ($(id).disabled = on));
  async function action(label, path, body) {
    busy(true); log('> ' + label);
    const holdOutput=['download','run','build','probe'].includes(path);
    if(holdOutput)document.dispatchEvent(new Event('iqraw-command-start'));
    try {
      const j = path==='download'?await IQTransfer.download(body):path==='build'?await IQTransfer.build(body):await api(path, body);
      const output=path==='download'?IQTransfer.withoutProgress(j.out):j.out;
      const text=(j.warning?output.replace(j.warning,''):output).trim();
      if(text)log(text,j.ok?'okk':'err');
      else if(!j.ok)log('(no output)','err');
      if(j.warning)log(j.warning.trim(),'err');
      if(j.ok)log('Done.','okk');else log(label + ' failed.', 'err');
      return j;
    } catch (e) { log(String(e.message || e), 'err'); }
    finally{if(holdOutput)document.dispatchEvent(new Event('iqraw-command-end'));busy(false);}
  }

  // ---- slots ----
  for (let i = 1; i <= 8; i++) $('slot').add(new Option('Slot ' + i, i));
  $('slot').value = store.get('slot', '1');
  $('name').value = store.get('name', 'iq-raw');
  $('slot').onchange = () => store.set('slot', $('slot').value);
  $('name').onchange = () => store.set('name', $('name').value);

  // ---- blocks and code ----
  // CSS variables keep Blockly in sync with the selected app theme.
  const theme = Blockly.Theme.defineTheme('iqraw', {
    base: Blockly.Themes.Zelos,
    componentStyles: {
      workspaceBackgroundColour: 'var(--panel)',
      toolboxBackgroundColour: 'var(--panel)',
      toolboxForegroundColour: 'var(--ink)',
      flyoutBackgroundColour: 'var(--bg)',
      flyoutForegroundColour: 'var(--ink)',
      flyoutOpacity: 1,
      scrollbarColour: 'var(--muted)',
    },
  });
  const ws = Blockly.inject('blocklyDiv', { renderer: 'zelos', theme, toolbox: Blockly.IQ_TOOLBOX, grid: { spacing: 24, length: 2, colour: '#8884', snap: true }, zoom: { controls: true, wheel: true, startScale: 0.9 }, trashcan: true, move: { scrollbars: true, drag: true, wheel: true } });
  new ResizeObserver(() => Blockly.svgResize(ws)).observe($('blocklyDiv'));
  const code = $('code');
  let manual = store.get('manual', '0') === '1';
  const generate = () => (lang === 'cpp' ? Blockly.Cpp : Blockly.Python).workspaceToCode(ws);

  function applyMode() {
    $('manual').checked = manual;
    code.readOnly = !manual;
    $('codeMode').textContent = manual ? 'Editing by hand' : 'Synced with blocks';
  }
  function refreshFromBlocks() {
    if (manual) return;
    code.value = generate() || STARTERS[lang];
    store.set('code.' + lang, code.value);
  }
  IQEditor.restore(ws, store.get('ws', ''));
  store.set('ws', JSON.stringify(Blockly.serialization.workspaces.save(ws)));
  code.value = manual ? store.get('code.' + lang, STARTERS[lang]) : generate() || STARTERS[lang];
  applyMode();
  const showLang = () => { $('vm').hidden = lang === 'cpp'; $('probe').hidden = lang === 'cpp'; $('build').hidden = lang !== 'cpp'; };
  showLang();
  ws.addChangeListener((e) => {
    if (e.isUiEvent) return;
    store.set('ws', JSON.stringify(Blockly.serialization.workspaces.save(ws)));
    refreshFromBlocks();
  });
  $('manual').onchange = () => {
    if ($('manual').checked) { manual = true; }
    else if (confirm('Go back to blocks? Anything you typed in the code box is replaced by what the blocks make.')) { manual = false; refreshFromBlocks(); }
    store.set('manual', manual ? '1' : '0');
    applyMode();
  };
  code.addEventListener('input', () => store.set('code.' + lang, code.value));
  $('lang').onchange = () => {
    if (manual) store.set('code.' + lang, code.value);
    lang = $('lang').value;
    store.set('lang', lang);
    code.value = manual ? store.get('code.' + lang, STARTERS[lang]) : generate() || STARTERS[lang];
    showLang();
  };
  code.addEventListener('keydown', (e) => {
    if (e.key !== 'Tab' || code.readOnly) return;
    e.preventDefault();
    const s = code.selectionStart;
    code.setRangeText('    ', s, code.selectionEnd, 'end');
    store.set('code.' + lang, code.value);
  });

  // ---- file open / save ----
  $('save').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([code.value], { type: 'text/x-python' }));
    a.download = ($('name').value.trim() || 'iq-raw').replace(/[^\w.-]+/g, '_') + (lang === 'cpp' ? '.cpp' : '.py');
    a.click(); URL.revokeObjectURL(a.href);
  };
  $('open').onclick = () => $('file').click();
  $('file').onchange = async () => {
    const f = $('file').files[0]; if (!f) return;
    code.value = await f.text(); manual = true; store.set('manual', '1'); store.set('code.' + lang, code.value); applyMode();
    $('file').value = '';
  };

  // ---- brain ----
  async function checkBrain() {
    const el = $('brain'); el.className = ''; el.textContent = 'Brain: checking...';
    try {
      const j = await api('info');
      if (j.ok) {
        // IQ2 status nests brain and battery details under iq2.
        const info = j.info || {};
        const device = info.iq2 || info;
        const b = device.brain || device;
        const battery = device.system?.battery ?? b.battery;
        const ver = (v) => { const n = parseInt(v, 16); return Number.isNaN(n) ? '' : [n >>> 24, (n >>> 16) & 255, (n >>> 8) & 255, n & 255].join('.'); };
        const bits = [typeof b.name === 'string' && b.name, typeof b.vexos === 'string' && ver(b.vexos) && 'VEXos ' + ver(b.vexos), Number.isFinite(Number(battery)) && battery != null && 'battery ' + battery + '%'].filter(Boolean);
        el.textContent = 'Brain: connected' + (bits.length ? ' (' + bits.join(', ') + ')' : '');
        el.className = 'ok';
      } else { el.textContent = 'Brain: not found. Plug it in by USB and turn it on.'; el.className = 'bad'; log(j.out.trim(), 'err'); }
    } catch (e) { el.textContent = 'Brain: ' + e.message; el.className = 'bad'; }
  }
  $('refresh').onclick = checkBrain;
  $('programs').onclick = async () => { busy(true); log('> programs'); try { const j = await api('programs'); log(j.out.trim() || '(none)', j.ok ? 'okk' : 'err'); } catch (e) { log(e.message, 'err'); } finally { busy(false); } };
  const slot = () => Number($('slot').value);
  const send = (run) => async () => {
    if (!code.value.trim()) return log('Nothing to send.', 'err');
    await action(`download to slot ${slot()}${run ? ' and run' : ''}`, 'download', { code: code.value, slot: slot(), name: $('name').value, run, lang });
  };
  $('send').onclick = send(true);
  $('sendOnly').onclick = send(false);
  $('probe').onclick = () => action('probe brain API (runs a test program in slot 8)', 'probe', { slot: 8 });
  $('build').onclick = () => action('build C++', 'build', { code: code.value });
  $('run').onclick = () => action(`run slot ${slot()}`, 'run', { slot: slot() });
  $('stop').onclick = () => action('stop', 'stop', {});
  $('vm').onclick = () => confirm('Put the Python VM on the brain now? This takes a minute. Do not unplug it.') && action('install Python VM', 'python-vm', {});
  IQEditor.setup(ws, {api, log});
  checkBrain();
})();
</script>
</body>
</html>
